<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar POS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

  header {
    background: #16213e;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #e94560;
  }
  header h1 { font-size: 20px; color: #e94560; }
  header span { font-size: 13px; color: #aaa; }

  .container { display: flex; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }

  /* PRODUCTOS */
  .productos { flex: 1; }
  .productos h2 { font-size: 14px; text-transform: uppercase; color: #aaa; margin-bottom: 12px; letter-spacing: 1px; }

  .categorias { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #333;
    background: transparent; color: #aaa; cursor: pointer; font-size: 12px;
    transition: all .2s;
  }
  .cat-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .prod-card {
    background: #16213e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
  }
  .prod-card:hover { border-color: #e94560; transform: translateY(-2px); }
  .prod-card:active { transform: scale(.95); }
  .prod-card.agotado { opacity: .4; pointer-events: none; }
  .prod-emoji { font-size: 32px; margin-bottom: 6px; }
  .prod-nombre { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  .prod-precio { font-size: 15px; font-weight: bold; color: #e94560; }
  .prod-stock { font-size: 10px; color: #888; margin-top: 3px; }

  /* CARRITO */
  .carrito {
    width: 300px;
    background: #16213e;
    border-radius: 12px;
    border: 1px solid #2a2a4a;
    display: flex;
    flex-direction: column;
    height: fit-content;
    position: sticky;
    top: 16px;
  }
  .carrito-header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2a4a;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .carrito-items { padding: 8px 16px; min-height: 120px; max-height: 320px; overflow-y: auto; }
  .carrito-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #1a1a2e;
  }
  .ci-info { flex: 1; }
  .ci-nombre { font-size: 12px; font-weight: bold; }
  .ci-precio { font-size: 11px; color: #aaa; }
  .ci-ctrl { display: flex; align-items: center; gap: 5px; }
  .ci-btn {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid #333; background: #1a1a2e;
    color: #eee; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .ci-btn:hover { border-color: #e94560; color: #e94560; }
  .ci-qty { font-size: 13px; font-weight: bold; min-width: 18px; text-align: center; }
  .ci-total { font-size: 12px; font-weight: bold; color: #e94560; min-width: 55px; text-align: right; }

  .carrito-empty { text-align: center; padding: 30px 0; color: #555; font-size: 13px; }

  .carrito-footer { padding: 14px 16px; border-top: 1px solid #2a2a4a; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .total-lbl { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
  .total-amt { font-size: 26px; font-weight: bold; color: #e94560; }

  .btn-cobrar {
    width: 100%; padding: 13px; border-radius: 8px;
    background: #e94560; border: none; color: #fff;
    font-size: 15px; font-weight: bold; cursor: pointer;
    transition: all .2s;
  }
  .btn-cobrar:hover { background: #c73652; }
  .btn-cobrar:disabled { background: #333; color: #666; cursor: default; }
  .btn-limpiar {
    width: 100%; padding: 8px; border-radius: 8px;
    background: transparent; border: 1px solid #333;
    color: #888; font-size: 12px; cursor: pointer; margin-top: 6px;
  }
  .btn-limpiar:hover { border-color: #e94560; color: #e94560; }

  /* MODAL COBRO */
  .modal-ov {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: #16213e; border: 1px solid #2a2a4a;
    border-radius: 14px; padding: 24px; width: 100%; max-width: 360px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .subtotal { font-size: 13px; color: #aaa; margin-bottom: 20px; }
  .metodos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .metodo-btn {
    padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a;
    background: #1a1a2e; color: #eee; cursor: pointer;
    font-size: 13px; text-align: center; transition: all .2s;
  }
  .metodo-btn:hover, .metodo-btn.sel { border-color: #e94560; background: rgba(233,69,96,.12); color: #e94560; }
  .metodo-ico { font-size: 20px; display: block; margin-bottom: 4px; }

  .efectivo-box { margin-bottom: 16px; }
  .efectivo-box label { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; display: block; margin-bottom: 6px; }
  .efectivo-box input {
    width: 100%; padding: 10px 12px; background: #1a1a2e;
    border: 1px solid #333; border-radius: 8px; color: #eee;
    font-size: 18px; font-weight: bold; outline: none;
  }
  .efectivo-box input:focus { border-color: #e94560; }
  .vuelto-box {
    background: rgba(46,213,115,.1); border: 1px solid rgba(46,213,115,.3);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
  }
  .vuelto-lbl { font-size: 10px; text-transform: uppercase; color: #2ed573; letter-spacing: 1px; margin-bottom: 2px; }
  .vuelto-amt { font-size: 24px; font-weight: bold; color: #2ed573; }

  .modal-btns { display: flex; gap: 8px; }
  .btn-confirmar {
    flex: 1; padding: 12px; background: #e94560; border: none;
    border-radius: 8px; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .btn-confirmar:disabled { background: #333; color: #666; cursor: default; }
  .btn-cancelar {
    padding: 12px 16px; background: transparent; border: 1px solid #333;
    border-radius: 8px; color: #888; font-size: 13px; cursor: pointer;
  }

  /* VENTA EXITOSA */
  .venta-ok {
    text-align: center; padding: 20px 0;
  }
  .venta-ok .check { font-size: 56px; margin-bottom: 10px; }
  .venta-ok h3 { font-size: 20px; margin-bottom: 6px; color: #2ed573; }
  .venta-ok p { font-size: 13px; color: #aaa; margin-bottom: 20px; }

  /* HISTORIAL */
  .historial-toggle {
    display: block; margin: 12px auto 0; padding: 8px 20px;
    background: transparent; border: 1px solid #2a2a4a;
    border-radius: 20px; color: #aaa; font-size: 12px; cursor: pointer;
  }
  .historial-toggle:hover { border-color: #e94560; color: #e94560; }
  .historial {
    margin-top: 16px; background: #16213e;
    border: 1px solid #2a2a4a; border-radius: 12px; overflow: hidden;
  }
  .historial h3 { padding: 12px 16px; font-size: 13px; text-transform: uppercase; color: #aaa; border-bottom: 1px solid #2a2a4a; letter-spacing: 1px; }
  .historial-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid #1a1a2e; font-size: 12px;
  }
  .historial-item:last-child { border-bottom: none; }
  .h-hora { color: #888; }
  .h-items { color: #ccc; flex: 1; margin: 0 10px; }
  .h-metodo { color: #aaa; font-size: 10px; }
  .h-total { font-weight: bold; color: #e94560; }

  @media (max-width: 700px) {
    .container { flex-direction: column; padding: 10px; }
    .carrito { width: 100%; position: static; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <h1>🍺 Bar & Snacks POS</h1>
  <span id="fecha"></span>
</header>

<div class="container">

  <!-- PRODUCTOS -->
  <div class="productos">
    <h2>Productos</h2>
    <div class="categorias" id="categorias"></div>
    <div class="grid" id="grid-productos"></div>

    <!-- Historial -->
    <button class="historial-toggle" onclick="toggleHistorial()">📋 Ver historial de ventas</button>
    <div class="historial" id="historial" style="display:none">
      <h3>Historial</h3>
      <div id="historial-items"></div>
    </div>
  </div>

  <!-- CARRITO -->
  <div class="carrito">
    <div class="carrito-header">
      <span>🛒 Pedido</span>
      <span id="carrito-count" style="font-size:12px;color:#aaa">0 items</span>
    </div>
    <div class="carrito-items" id="carrito-items">
      <div class="carrito-empty">El carrito está vacío</div>
    </div>
    <div class="carrito-footer">
      <div class="total-row">
        <span class="total-lbl">Total</span>
        <span class="total-amt" id="total">$0</span>
      </div>
      <button class="btn-cobrar" id="btn-cobrar" onclick="abrirCobro()" disabled>Cobrar</button>
      <button class="btn-limpiar" onclick="limpiarCarrito()">Limpiar carrito</button>
    </div>
  </div>
</div>

<!-- MODAL COBRO -->
<div class="modal-ov" id="modal" style="display:none" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
/* ═══════════════════════════════════════
   PRODUCTOS — Edita aquí tu catálogo
═══════════════════════════════════════ */
const PRODUCTOS = [
  // CERVEZAS
  { id:1, nombre:'Poker 330ml',     emoji:'🍺', categoria:'Cervezas', precio:3500,  stock:50 },
  { id:2, nombre:'Águila 330ml',    emoji:'🍺', categoria:'Cervezas', precio:3500,  stock:50 },
  { id:3, nombre:'Costeña 330ml',   emoji:'🍺', categoria:'Cervezas', precio:3000,  stock:40 },
  { id:4, nombre:'Club Colombia',   emoji:'🍺', categoria:'Cervezas', precio:4500,  stock:30 },
  { id:5, nombre:'Poker litro',     emoji:'🍻', categoria:'Cervezas', precio:7000,  stock:20 },
  // LICORES
  { id:6, nombre:'Aguardiente Néctar', emoji:'🥃', categoria:'Licores', precio:45000, stock:10 },
  { id:7, nombre:'Ron Medellín',       emoji:'🥃', categoria:'Licores', precio:38000, stock:8  },
  { id:8, nombre:'Shot Aguardiente',   emoji:'🥃', categoria:'Licores', precio:3000,  stock:99 },
  // BEBIDAS
  { id:9,  nombre:'Gaseosa 400ml',  emoji:'🥤', categoria:'Bebidas', precio:3000, stock:30 },
  { id:10, nombre:'Agua 600ml',     emoji:'💧', categoria:'Bebidas', precio:2000, stock:40 },
  { id:11, nombre:'Jugo Hit',       emoji:'🍹', categoria:'Bebidas', precio:3500, stock:20 },
  { id:12, nombre:'Red Bull',       emoji:'⚡', categoria:'Bebidas', precio:8000, stock:12 },
  // SNACKS
  { id:13, nombre:'Papas Margarita', emoji:'🍟', categoria:'Snacks', precio:3500, stock:25 },
  { id:14, nombre:'Maní',            emoji:'🥜', categoria:'Snacks', precio:2000, stock:30 },
  { id:15, nombre:'Chitos',          emoji:'🧡', categoria:'Snacks', precio:2500, stock:20 },
  { id:16, nombre:'Nucítas',         emoji:'🍫', categoria:'Snacks', precio:3000, stock:15 },
  { id:17, nombre:'Doritos',         emoji:'🌽', categoria:'Snacks', precio:3500, stock:18 },
]

/* ═══════════════════════════════════════
   ESTADO
═══════════════════════════════════════ */
let carrito    = []
let catActiva  = 'Todas'
let historial  = []
let stockActual = PRODUCTOS.map(p => ({ ...p })) // copia con stock mutable

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-CO', { weekday:'long', day:'2-digit', month:'long' })

function init() {
  renderCategorias()
  renderProductos()
}

/* ═══════════════════════════════════════
   CATEGORÍAS
═══════════════════════════════════════ */
function renderCategorias() {
  const cats = ['Todas', ...new Set(PRODUCTOS.map(p => p.categoria))]
  const el = document.getElementById('categorias')
  el.innerHTML = cats.map(c => `
    <button class="cat-btn ${c === catActiva ? 'active' : ''}" onclick="filtrar('${c}')">${c}</button>
  `).join('')
}

function filtrar(cat) {
  catActiva = cat
  renderCategorias()
  renderProductos()
}

/* ═══════════════════════════════════════
   PRODUCTOS
═══════════════════════════════════════ */
function renderProductos() {
  const lista = catActiva === 'Todas' ? stockActual : stockActual.filter(p => p.categoria === catActiva)
  const el = document.getElementById('grid-productos')
  el.innerHTML = lista.map(p => `
    <div class="prod-card ${p.stock <= 0 ? 'agotado' : ''}" onclick="agregar(${p.id})">
      <div class="prod-emoji">${p.emoji}</div>
      <div class="prod-nombre">${p.nombre}</div>
      <div class="prod-precio">${fmtPrecio(p.precio)}</div>
      <div class="prod-stock">${p.stock <= 0 ? 'Agotado' : 'Stock: ' + p.stock}</div>
    </div>
  `).join('')
}

/* ═══════════════════════════════════════
   CARRITO
═══════════════════════════════════════ */
function agregar(id) {
  const prod = stockActual.find(p => p.id === id)
  if (!prod || prod.stock <= 0) return

  const ex = carrito.find(i => i.id === id)
  if (ex) {
    if (ex.qty >= prod.stock) return
    ex.qty++
  } else {
    carrito.push({ id: prod.id, nombre: prod.nombre, emoji: prod.emoji, precio: prod.precio, qty: 1 })
  }

  renderCarrito()
  renderProductos()
}

function cambiarQty(id, delta) {
  const item = carrito.find(i => i.id === id)
  if (!item) return
  item.qty += delta
  if (item.qty <= 0) carrito = carrito.filter(i => i.id !== id)
  renderCarrito()
  renderProductos()
}

function limpiarCarrito() {
  carrito = []
  renderCarrito()
}

function renderCarrito() {
  const el    = document.getElementById('carrito-items')
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0)
  const count = carrito.reduce((s, i) => s + i.qty, 0)

  document.getElementById('carrito-count').textContent = count + ' item' + (count !== 1 ? 's' : '')
  document.getElementById('total').textContent = fmtPrecio(total)
  document.getElementById('btn-cobrar').disabled = carrito.length === 0

  if (carrito.length === 0) {
    el.innerHTML = '<div class="carrito-empty">El carrito está vacío</div>'
    return
  }

  el.innerHTML = carrito.map(item => `
    <div class="carrito-item">
      <div class="ci-info">
        <div class="ci-nombre">${item.emoji} ${item.nombre}</div>
        <div class="ci-precio">${fmtPrecio(item.precio)} c/u</div>
      </div>
      <div class="ci-ctrl">
        <button class="ci-btn" onclick="cambiarQty(${item.id}, -1)">−</button>
        <span class="ci-qty">${item.qty}</span>
        <button class="ci-btn" onclick="cambiarQty(${item.id}, 1)">+</button>
      </div>
      <div class="ci-total">${fmtPrecio(item.precio * item.qty)}</div>
    </div>
  `).join('')
}

/* ═══════════════════════════════════════
   COBRO
═══════════════════════════════════════ */
let metodoPago  = null

function abrirCobro() {
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0)
  metodoPago  = null
  document.getElementById('modal-content').innerHTML = modalCobroHTML(total)
  document.getElementById('modal').style.display = 'flex'
}

function modalCobroHTML(total) {
  return `
    <h3>💳 Cobrar</h3>
    <p class="subtotal">Total a cobrar: <strong style="color:#e94560">${fmtPrecio(total)}</strong></p>

    <p style="font-size:11px;text-transform:uppercase;color:#aaa;letter-spacing:1px;margin-bottom:8px">Método de pago</p>
    <div class="metodos">
      <div class="metodo-btn" onclick="selMetodo('Efectivo', ${total})" id="m-Efectivo">
        <span class="metodo-ico">💵</span>Efectivo
      </div>
      <div class="metodo-btn" onclick="selMetodo('Nequi', ${total})" id="m-Nequi">
        <span class="metodo-ico">📱</span>Nequi
      </div>
      <div class="metodo-btn" onclick="selMetodo('Daviplata', ${total})" id="m-Daviplata">
        <span class="metodo-ico">📲</span>Daviplata
      </div>
      <div class="metodo-btn" onclick="selMetodo('Tarjeta', ${total})" id="m-Tarjeta">
        <span class="metodo-ico">💳</span>Tarjeta
      </div>
    </div>

    <div id="efectivo-section" style="display:none">
      <div class="efectivo-box">
        <label>Efectivo recibido</label>
        <input type="number" id="efectivo-input" placeholder="${total}" oninput="calcVuelto(${total})" min="${total}"/>
      </div>
      <div class="vuelto-box" id="vuelto-box" style="display:none">
        <div class="vuelto-lbl">Vuelto a devolver</div>
        <div class="vuelto-amt" id="vuelto-amt">$0</div>
      </div>
    </div>

    <div class="modal-btns">
      <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarVenta(${total})" disabled>✓ Confirmar venta</button>
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>
  `
}

function selMetodo(metodo, total) {
  metodoPago = metodo
  document.querySelectorAll('.metodo-btn').forEach(b => b.classList.remove('sel'))
  document.getElementById('m-' + metodo).classList.add('sel')

  const secEfec = document.getElementById('efectivo-section')
  if (metodo === 'Efectivo') {
    secEfec.style.display = 'block'
    document.getElementById('btn-confirmar').disabled = true
  } else {
    secEfec.style.display = 'none'
    document.getElementById('btn-confirmar').disabled = false
  }
}

function calcVuelto(total) {
  const recibido = Number(document.getElementById('efectivo-input').value) || 0
  const vueltoBox = document.getElementById('vuelto-box')
  const btnConf   = document.getElementById('btn-confirmar')

  if (recibido >= total) {
    const vuelto = recibido - total
    document.getElementById('vuelto-amt').textContent = fmtPrecio(vuelto)
    vueltoBox.style.display = 'block'
    btnConf.disabled = false
    btnConf.textContent = vuelto > 0 ? `✓ Confirmar · Vuelto ${fmtPrecio(vuelto)}` : '✓ Confirmar venta'
  } else {
    vueltoBox.style.display = 'none'
    btnConf.disabled = true
    btnConf.textContent = '✓ Confirmar venta'
  }
}

function confirmarVenta(total) {
  // Descontar stock
  carrito.forEach(item => {
    const prod = stockActual.find(p => p.id === item.id)
    if (prod) prod.stock -= item.qty
  })

  // Guardar en historial
  historial.unshift({
    hora: new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }),
    items: carrito.map(i => i.nombre + ' ×' + i.qty).join(', '),
    metodo: metodoPago,
    total
  })

  const itemsVendidos = carrito.map(i => i.nombre + ' ×' + i.qty).join(', ')

  // Mostrar confirmación
  document.getElementById('modal-content').innerHTML = `
    <div class="venta-ok">
      <div class="check">✅</div>
      <h3>¡Venta registrada!</h3>
      <p>${itemsVendidos}</p>
      <p style="font-size:16px;color:#e94560;font-weight:bold;margin-bottom:6px">${fmtPrecio(total)}</p>
      <p>Método: ${metodoPago}</p>
      <button class="btn-confirmar" style="margin-top:14px;max-width:200px" onclick="cerrarModal()">Cerrar</button>
    </div>
  `

  // Limpiar carrito
  carrito = []
  renderCarrito()
  renderProductos()
  renderHistorial()
}

function cerrarModal() {
  document.getElementById('modal').style.display = 'none'
}

/* ═══════════════════════════════════════
   HISTORIAL
═══════════════════════════════════════ */
function toggleHistorial() {
  const el = document.getElementById('historial')
  el.style.display = el.style.display === 'none' ? 'block' : 'none'
  renderHistorial()
}

function renderHistorial() {
  const el = document.getElementById('historial-items')
  if (historial.length === 0) {
    el.innerHTML = '<div style="padding:16px;text-align:center;color:#555;font-size:13px">Sin ventas aún</div>'
    return
  }
  el.innerHTML = historial.map(v => `
    <div class="historial-item">
      <span class="h-hora">${v.hora}</span>
      <span class="h-items">${v.items}</span>
      <span class="h-metodo">${v.metodo}</span>
      <span class="h-total">${fmtPrecio(v.total)}</span>
    </div>
  `).join('')
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function fmtPrecio(n) {
  return '$' + Math.round(n).toLocaleString('es-CO')
}

// Arrancar
init()
</script>
</body>
</html>
